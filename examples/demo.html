<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiCursor Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #333; }
    p { color: #666; line-height: 1.6; }
    .hint { font-size: 0.9rem; color: #888; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>MultiCursor Demo</h1>
  <p>Open this page in multiple browser tabs or windows to see each other's cursors in real time.</p>
  <p>Make sure the cursor server is running: <code>pnpm run cursors</code></p>
  <p class="hint">Cursors will appear as colored arrows. Move your mouse to broadcast your position.</p>

  <script type="module">
    import { initCursors } from '../packages/client/dist/index.mjs';
    const destroy = initCursors({ room: 'demo', serverUrl: 'ws://localhost:3001' });
    window.addEventListener('beforeunload', destroy);
  </script>
</body>
</html>
